name: Deploy server-2 to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Copy entire code to VM
        env:
          SSH_PASSWORD: ${{ secrets.VM_SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -r ./ serveruser@YOUR_VM_IP:/home/serveruser/server-2

          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no serveruser@YOUR_VM_IP << 'EOF'
            cd /home/serveruser/server-2

            tmux has-session -t server2session 2>/dev/null
            if [ $? = 0 ]; then
              tmux kill-session -t server2session
            fi

            npm install --production

            tmux new-session -d -s server2session 'npm start'
          EOF
